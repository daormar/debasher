# yaml-language-server: $schema=https://debasher.readthedocs.io/en/latest/_static/schema/program-1.json
schema_version: 1
name: webui_dynamic_fanout_fifos
description: >-
  Example built with the web UI: a generated file is counted and cut into fragments,
  which a dispatcher streams through FIFOs to a pool of workers, and a last process
  merges their counts.
program_options:
  -l: '200'
  -c: '20'
  -b: '20'
  -w: '4'
processes:
  count:
    description: >-
      Counts characters of an input file in a conventional way. This process is
      added for debugging purposes.
    code: count.sh
    specs: {cpus: 1, mem: 32, time: '00:01:00'}
    position: {x: 60, y: 220}
    options:
      -inf:
        type: file
        description: input file
        from: generate.-outf
      -outf:
        type: file
        description: output file
        value: ${process_outdir}/counts.txt
  generate:
    description: Generates a text file of a given size and random content.
    code: generate.sh
    specs: {cpus: 1, mem: 32, time: '00:01:00'}
    position: {x: 260, y: 40}
    options:
      -outf:
        type: file
        description: output file
        value: ${process_outdir}/file.txt
      -l:
        type: int
        description: Length of file in lines
        cmdline: true
      -c:
        type: int
        description: Length of each line in characters
        cmdline: true
  fragment:
    description: >-
      Fragments an input file into a given number of equally sized blocks, inverting
      the file lines.
    code: fragment.sh
    specs: {cpus: 1, mem: 32, time: '00:01:00', processdeps: 'afterok:count'}
    position: {x: 360, y: 220}
    options:
      -outd:
        type: dir
        description: name of output directory
        value: ${process_outdir}
      -outf:
        type: file
        description: output fifo
        value: fragment_fifo
        channel: fifo
      -inf:
        type: file
        description: input file
        from: generate.-outf
      -b:
        type: int
        description: Number of blocks
        cmdline: true
  aggregate:
    description: Aggregates worker results.
    code: aggregate.sh
    specs: {cpus: 1, mem: 32, time: '00:01:00'}
    position: {x: 360, y: 760}
    options:
      -outf:
        type: file
        description: output file
        value: ${process_outdir}/result.txt
      -w:
        type: int
        description: Number of workers.
        cmdline: true
      -ind-ith:
        type: dir
        description: i'th input directory
        count_source: -w
        from: worker.-outd
  dispatch:
    description: Dispatches file blocks to workers.
    script: ./dynamic_fanout_dispatcher.py
    specs: {cpus: 1, mem: 32, time: '00:01:00'}
    position: {x: 360, y: 400}
    options:
      -outf-ith:
        type: file
        description: i'th output fifo
        value: dispatch_fifo_${i}
        channel: fifo
        count_source: -w
      -w:
        type: int
        description: Number of workers.
        cmdline: true
      -inf:
        type: file
        description: input fifo
        from: fragment.-outf
      --log-level:
        type: string
        description: >-
          Logging verbosity. Choices: DEBUG, INFO, WARNING, ERROR, CRITICAL (default:
          INFO).
        cmdline: true
        mandatory: false
  worker:
    description: >-
      Executes an array of w tasks. Each task takes a list of text files and generates
      another file for each one.
    code: worker.sh
    mode: array
    tasks: worker_tasks.sh
    specs: {cpus: 1, mem: 32, time: '00:01:00'}
    position: {x: 360, y: 580}
    options:
      -outd:
        type: dir
        description: >-
          directory of the task, below the output directory of the process
        channel: process_outdir
        subpath: ${task_idx}
      -inf:
        type: file
        description: input fifo
        from: dispatch.-outf-ith
      -w:
        type: int
        description: Number of workers.
        cmdline: true
        shaping: true
