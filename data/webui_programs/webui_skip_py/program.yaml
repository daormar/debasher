# yaml-language-server: $schema=https://debasher.readthedocs.io/en/latest/_static/schema/program-1.json
schema_version: 1
name: webui_skip_py
description: >-
  Example built with the web UI: a process sums two numbers into a value descriptor,
  and another writes the sum plus one, skipped by a rule in Python when the sum
  is odd.
program_options:
  -num-a: '1'
  -num-b: '3'
processes:
  value_writer:
    description: Takes two numbers and produces their sum as output.
    code: value_writer.sh
    specs: {cpus: 1, mem: 32, time: '00:01:00'}
    position: {x: 100, y: 100}
    options:
      -num-a:
        type: int
        description: First number to be summed
        cmdline: true
      -num-b:
        type: int
        description: Second number to be summed
        cmdline: true
      -outv:
        type: int
        description: output value descriptor
        channel: value_desc
  value_reader:
    description: >-
      Reads the sum, increases it by one and writes it into a file; skipped when
      the sum is odd.
    code: value_reader.sh
    methods:
      skip: value_reader_skip.py
    specs: {cpus: 1, mem: 32, time: '00:01:00'}
    position: {x: 100, y: 260}
    options:
      -val-desc:
        type: int
        description: value descriptor
        from: value_writer.-outv
      -outf:
        type: file
        description: output file
        value: ${process_outdir}/value_reader.out
