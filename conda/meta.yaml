{% set version = "2.0.dev0" %}

package:
  name: debasher
  version: {{ version }}

source:
  # Built with "make dist-vendored" (see the root Makefile.am), not plain
  # "make dist": this tarball already contains a prebuilt frontend/dist/
  # and the generated ./configure + Makefile.in files, so the build below
  # needs neither npm nor autoconf/automake/a compiler, only make.
  # Re-run sha256sum on whatever gets uploaded to the release and update
  # the value below; this one is from a local test build, not a published
  # release.
  url: https://github.com/daormar/debasher/releases/download/v{{ version }}/debasher-{{ version }}.tar.gz
  sha256: 16cccebc513967e0499bb524bca8a224199de48e2e672cd16ac15b77d4d45315

build:
  number: 0
  # One package for Linux and macOS: everything installed is Bash,
  # Python and the built frontend, and every tool path that configure
  # writes into the installed scripts points inside the environment (see
  # the host requirements below) or is a bare name looked up in the PATH
  # at run time (see build.sh).
  noarch: generic

requirements:
  build:
    - make
  # Every tool whose absolute path configure writes into the installed
  # scripts is a host requirement, not only a run one: configure then
  # finds it under $PREFIX, and conda rewrites that prefix to the one of
  # the environment the package is installed into. Found anywhere else
  # (the build machine's /usr/bin, or $BUILD_PREFIX), the path would
  # point to a tool that may not exist where the package runs, such as
  # a Bash 4.3 or newer on macOS, or would be a BSD tool there instead
  # of the GNU one that the engine needs.
  host:
    - bash >=4.3
    - python
    - coreutils
    - findutils
    - sed
    - grep
    - gawk
    - diffutils
    - gzip
    - util-linux  # flock
    - graphviz
  run:
    - bash >=4.3
    # Any Python 3: conda_build_config.yaml keeps conda-build from
    # pinning this to the minor version of the build's Python.
    - python
    - coreutils
    - findutils
    - sed
    - grep
    - gawk
    - diffutils
    - gzip
    - util-linux  # flock
    - graphviz
    # The web UI's server (api/): its direct dependencies only, the rest
    # comes with them.
    - fastapi >=0.110
    - pydantic >=2
    - uvicorn >=0.30
    - python-multipart >=0.0.9

test:
  requires:
    - curl
  # run_test.sh: checks the tool paths written into the installed
  # scripts, runs example programs to their end and checks the web UI.

about:
  home: http://daormar.github.io/debasher/
  license: LGPL-3.0-or-later
  license_file: COPYING.LESSER
  summary: Flow-based-programming extension for Bash, for building and running bioinformatics workflows.
  description: |
    DeBasher lets you write workflows ("programs") as Bash (or Python/R/
    Perl/Groovy) functions ("processes") with named input/output options;
    the way options connect across processes implicitly defines the
    program's dependency graph, which the engine schedules and executes,
    with fifo-based streaming between processes and optional conda/docker
    environments per process. This package installs the engine, the
    FastAPI backend and the built React Flow visual editor
    (`debasher_webui`).
  doc_url: https://debasher.readthedocs.io/en/latest/
  dev_url: https://github.com/daormar/debasher

extra:
  recipe-maintainers:
    - daormar
